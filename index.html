
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch the Stars</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10152f;
  color: white;
  text-align: center;
}

h1 { color: #ffe66d; margin-bottom: 8px; }

p { margin: 8px; }

.game {
  width: min(92%, 600px);
  margin: 20px auto;
}

.info {
  display: flex;
  justify-content: space-around;
  gap: 8px;
  margin: 14px 0;
  font-size: 17px;
}

canvas {
  display: block;
  width: 100%;
  background: linear-gradient(#172957, #354f80);
  border: 3px solid #ffe66d;
  border-radius: 12px;
  touch-action: none;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  margin: 6px;
  background: #ffe66d;
  color: #202342;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.controls button { width: 90px; }

#message {
  color: #ffe66d;
  min-height: 24px;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="game">
  <h1>⭐ Catch the Stars ⭐</h1>
  <p>Move your basket and catch as many stars as you can!</p>

  <div class="info">
    <span>Score: <b id="score">0</b></span>
    <span>Time: <b id="time">30</b>s</span>
  </div>

  <canvas id="game" width="600" height="440"></canvas>

  <div class="controls">
    <button id="left" aria-label="Move left">⬅ Left</button>
    <button id="right" aria-label="Move right">Right ➡</button>
  </div>

  <p id="message">Press Start to play!</p>
  <button id="start">▶ Start Game</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const message = document.getElementById("message");
const startButton = document.getElementById("start");

const W = canvas.width;
const H = canvas.height;

let basket, stars, score, timeLeft, running;
let lastTime = 0;
let spawnTime = 0;
let animationId = 0;
let keys = {};
let pointerDirection = 0;

function resetGame() {
  basket = { x: W / 2 - 42, y: H - 48, w: 84, h: 24, speed: 340 };
  stars = [];
  score = 0;
  timeLeft = 30;
  spawnTime = 0;
  scoreText.textContent = score;
  timeText.textContent = timeLeft;
}

function drawBackground() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,0.75)";

  for (let i = 0; i < 35; i++) {
    const x = (i * 97 + 23) % W;
    const y = (i * 67 + 17) % H;
    ctx.fillRect(x, y, 2, 2);
  }
}

function drawBasket() {
  ctx.font = "58px Arial";
  ctx.textAlign = "center";
  ctx.fillText("🧺", basket.x + basket.w / 2, basket.y + 28);
}

function drawStars() {
  ctx.font = "28px Arial";
  ctx.textAlign = "center";

  stars.forEach(star => {
    ctx.fillText("⭐", star.x, star.y);
  });
}

function finishGame() {
  running = false;
  message.textContent = "Game over! Final score: " + score;
  startButton.textContent = "↻ Play Again";
}

function update(dt) {
  timeLeft -= dt;

  if (timeLeft <= 0) {
    timeLeft = 0;
    timeText.textContent = 0;
    finishGame();
    return;
  }

  let direction = 0;

  if (keys.ArrowLeft || keys.a || pointerDirection === -1) {
    direction -= 1;
  }

  if (keys.ArrowRight || keys.d || pointerDirection === 1) {
    direction += 1;
  }

  basket.x += direction * basket.speed * dt;
  basket.x = Math.max(0, Math.min(W - basket.w, basket.x));

  spawnTime += dt;

  if (spawnTime >= 0.65) {
    spawnTime = 0;
    stars.push({
      x: 20 + Math.random() * (W - 40),
      y: -15,
      speed: 110 + Math.random() * 100
    });
  }

  for (let i = stars.length - 1; i >= 0; i--) {
    const star = stars[i];
    star.y += star.speed * dt;

    const caught =
      star.y + 10 >= basket.y &&
      star.y - 20 <= basket.y + basket.h &&
      star.x >= basket.x &&
      star.x <= basket.x + basket.w;

    if (caught) {
      score++;
      scoreText.textContent = score;
      stars.splice(i, 1);
    } else if (star.y > H + 25) {
      stars.splice(i, 1);
    }
  }

  timeText.textContent = Math.ceil(timeLeft);
}

function draw() {
  drawBackground();
  drawStars();
  drawBasket();
}

function loop(timestamp) {
  if (!running) return;

  const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.04);
  lastTime = timestamp;

  update(dt);
  draw();

  if (running) {
    animationId = requestAnimationFrame(loop);
  }
}

function startGame() {
  cancelAnimationFrame(animationId);
  resetGame();
  running = true;
  lastTime = 0;
  message.textContent = "Catch the stars!";
  startButton.textContent = "↻ Restart Game";
  draw();
  animationId = requestAnimationFrame(loop);
}

document.addEventListener("keydown", event => {
  if (["ArrowLeft", "ArrowRight", " "].includes(event.key)) {
    event.preventDefault();
  }
  keys[event.key] = true;
});

document.addEventListener("keyup", event => {
  keys[event.key] = false;
});

function holdButton(id, direction) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    pointerDirection = direction;
  });

  button.addEventListener("pointerup", () => {
    if (pointerDirection === direction) pointerDirection = 0;
  });

  button.addEventListener("pointerleave", () => {
    if (pointerDirection === direction) pointerDirection = 0;
  });

  button.addEventListener("pointercancel", () => {
    pointerDirection = 0;
  });
}

holdButton("left", -1);
holdButton("right", 1);

startButton.addEventListener("click", startGame);

resetGame();
draw();
</script>
</body>
</html>
